<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .dragon-body { fill: #d4af37; }
      .dragon-outline { stroke: #8b6f47; stroke-width: 1.5; fill: none; }
      .dragon-eye { fill: #2c1810; }
      .dragon-fire { fill: #ff6b35; }
    </style>
  </defs>
  
  <!-- Dragon Head -->
  <circle cx="45" cy="35" r="22" class="dragon-body"/>
  <path d="M 35 35 Q 28 30 25 40 Q 30 50 40 48" class="dragon-outline"/>
  
  <!-- Dragon Snout -->
  <ellipse cx="20" cy="38" rx="8" ry="6" class="dragon-body"/>
  <path d="M 20 38 L 15 38" class="dragon-outline" stroke-linecap="round"/>
  
  <!-- Dragon Eye -->
  <circle cx="38" cy="32" r="2.5" class="dragon-eye"/>
  <circle cx="37" cy="30" r="0.8" fill="white"/>
  
  <!-- Dragon Horns -->
  <path d="M 42 13 Q 40 5 38 8" class="dragon-outline" stroke-linecap="round"/>
  <path d="M 48 12 Q 50 4 52 7" class="dragon-outline" stroke-linecap="round"/>
  
  <!-- Dragon Body/Tail -->
  <path d="M 52 48 Q 65 45 72 55 Q 75 65 70 72 Q 60 75 55 68" class="dragon-outline"/>
  <path d="M 50 48 Q 65 50 75 60 Q 78 70 72 76 Q 62 78 55 70" class="dragon-body" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Dragon Wings -->
  <path d="M 48 40 Q 35 25 40 15 Q 50 20 55 35" class="dragon-body"/>
  <path d="M 48 40 Q 35 25 40 15 Q 50 20 55 35" class="dragon-outline"/>
  
  <path d="M 58 42 Q 75 28 82 18 Q 80 30 72 45" class="dragon-body"/>
  <path d="M 58 42 Q 75 28 82 18 Q 80 30 72 45" class="dragon-outline"/>
  
  <!-- Fire effect -->
  <path d="M 15 38 Q 10 35 8 40 Q 10 45 15 42" class="dragon-fire" opacity="0.8"/>
  <path d="M 18 35 Q 12 32 10 38 Q 12 44 18 40" class="dragon-fire" opacity="0.6"/>
</svg>
